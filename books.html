<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#FFE5C9">

<title>Books — Max Thackara</title>

<link
    href="https://fonts.googleapis.com/css2?family=Prata&display=swap"
    rel="stylesheet"
>

<link
    rel="icon"
    type="image/svg+xml"
    href="/images/favicon.svg"
>

<style>

:root {

    --bg: #FFE5C9;
    --bg-warm: #F7DDC0;
    --bg-deep: #F0D2B4;

    --text: #44554F;
    --text-soft: rgba(68, 85, 79, 0.78);

    --line: rgba(68, 85, 79, 0.22);

    --hover: #26302d;

    --shadow:
        0 14px 34px rgba(0,0,0,0.08);
}


/* --------------------------------
   PAGE
-------------------------------- */

* {
    box-sizing: border-box;
}

html {

    margin: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
}

body {

    margin: 0;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Prata', serif;

    color: var(--text);

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at top,
            var(--bg) 0%,
            var(--bg-warm) 48%,
            var(--bg-deep) 100%
        );

    overflow-x: hidden;

    position: relative;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* --------------------------------
   PAPER TEXTURE
-------------------------------- */

body::before {

    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.04;

    background-image:
        url("https://www.transparenttextures.com/patterns/paper-fibers.png");
}


/* --------------------------------
   MAIN LAYOUT
-------------------------------- */

main {

    flex: 1;

    width: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding:
        max(56px, env(safe-area-inset-top))
        48px
        max(90px, env(safe-area-inset-bottom));

    position: relative;
    z-index: 2;
}


/* --------------------------------
   HEADER
-------------------------------- */

.header-container {

    text-align: center;

    width: 100%;

    animation: fadeIn 1.1s ease;
}


/* --------------------------------
   TITLE
-------------------------------- */

.title {

    font-size: 2rem;

    letter-spacing: 0.3px;

    margin-bottom: 14px;

    display: inline-block;
    max-width: 100%;
}

.title a {

    text-decoration: none;

    color: inherit;

    display: inline-block;
    max-width: 100%;

    white-space: normal;
    overflow-wrap: break-word;
}


/* --------------------------------
   UNDERLINE
-------------------------------- */

.underline {

    width: 52px;

    height: 1px;

    background-color: var(--line);

    margin:
        0 auto
        34px auto;
}


/* --------------------------------
   NAV
-------------------------------- */

.page-nav {

    display: flex;
    justify-content: center;

    gap: 30px;

    font-size: 1.08rem;

    margin-bottom: 84px;

    flex-wrap: nowrap;
}

.page-nav a {

    text-decoration: none;

    color: var(--text-soft);

    transition:
        color 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;
}

.page-nav a:hover {

    color: var(--hover);

    transform: translateY(-1px);
}

.page-nav a.italic {
    font-style: italic;
}

.page-nav a.current {
    color: var(--text);
}

.nav-break {
    display: none;
}


/* --------------------------------
   BOOKS SECTION
-------------------------------- */

.books-container {

    width: 100%;

    display: flex;
    justify-content: center;
}


/* --------------------------------
   SHELF
-------------------------------- */

.book-shelf {

    display: flex;
    justify-content: center;

    flex-wrap: wrap;

    gap: clamp(24px, 5vw, 72px);

    max-width: 1080px;
    width: 100%;
}


/* --------------------------------
   BOOK
-------------------------------- */

.book {

    flex: 1 1 clamp(130px, 16%, 155px);

    display: block;

    min-height: 180px;
}


/* --------------------------------
   BOOK IMAGE
-------------------------------- */

.book img {

    width: 100%;

    display: block;

    border-radius: 4px;

    height: auto;

    object-fit: contain;

    transition:
        transform 0.35s ease,
        box-shadow 0.3s ease,
        opacity 0.3s ease;

    box-shadow: var(--shadow);
}


/* --------------------------------
   HOVER
-------------------------------- */

.book:hover img {

    transform:
        translateY(-10px)
        scale(1.012);

    box-shadow:
        0 22px 44px rgba(0,0,0,0.12);
}


/* --------------------------------
   ACCESSIBILITY
-------------------------------- */

a:focus-visible {

    outline: 1px solid var(--text);

    outline-offset: 4px;
}


/* --------------------------------
   ANIMATION
-------------------------------- */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* --------------------------------
   TABLET
-------------------------------- */

@media (max-width: 980px) {

    main {

        padding:
            max(48px, env(safe-area-inset-top))
            34px
            max(80px, env(safe-area-inset-bottom));
    }

    .title {
        font-size: 1.8rem;
    }

    .page-nav {

        gap: 22px;

        font-size: 1rem;

        margin-bottom: 62px;
    }
}


/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 750px) {

    main {

        padding-top:
            max(38px, env(safe-area-inset-top));

        padding-bottom:
            max(64px, env(safe-area-inset-bottom));

        padding-left:
            max(20px, env(safe-area-inset-left));

        padding-right:
            max(20px, env(safe-area-inset-right));
    }

    .title {

        font-size: 1.55rem;

        margin-bottom: 12px;
    }

    .underline {

        width: 46px;

        margin-bottom: 30px;
    }

    .page-nav {

        flex-wrap: wrap;

        justify-content: center;

        gap: 14px 22px;

        font-size: 0.98rem;

        margin-bottom: 52px;

        max-width: 340px;

        margin-left: auto;
        margin-right: auto;
    }

    .nav-break {

        display: block;

        flex-basis: 100%;

        height: 0;
    }

    .book-shelf {

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 38px 30px;

        width: 100%;
        max-width: 430px;

        margin-left: auto;
        margin-right: auto;
    }

    .book {

        width: 100%;

        min-height: 0;
    }

    .book img {

        width: 100%;
        max-width: 180px;

        margin-left: auto;
        margin-right: auto;
    }
}


/* --------------------------------
   SMALL PHONES
-------------------------------- */

@media (max-width: 419px) {

    .book-shelf {

        display: flex;
        flex-direction: column;

        align-items: center;

        gap: 40px;
    }

    .book {

        width: 62%;
        max-width: 190px;
    }

    .book img {

        max-width: none;
    }
}


/* --------------------------------
   SHORT SCREENS
-------------------------------- */

@media (max-height: 700px) {

    main {

        padding-top:
            max(28px, env(safe-area-inset-top));
    }

    .page-nav {

        margin-bottom: 40px;
    }
}


/* --------------------------------
   DYNAMIC MOBILE VIEWPORT
-------------------------------- */

@supports (height: 100dvh) {

    body {
        min-height: 100dvh;
    }
}

</style>
</head>

<body>

<main>

    <div class="header-container">

        <div class="title">

            <a href="index.html">
                Max Thackara
            </a>

        </div>

        <div class="underline"></div>

        <div class="page-nav">

            <a href="books.html" class="current">Books</a>
            <a href="sessions.html">Sessions</a>
            <a href="readings.html">Readings</a>
            <a href="editing.html">Editing</a>

            <span class="nav-break"></span>

            <a href="workshops.html">Workshops</a>
            <a href="contact.html">Contact</a>

        </div>

    </div>

    <section class="books-container">

        <div class="book-shelf">

            <a
                href="https://www.amazon.co.uk/Artists-Journey-Max-Thackara/dp/B0FFMBZX8D"
                class="book"
                target="_blank"
                rel="noopener"
            >
                <img
                    src="images/book1.png"
                    alt="The Artist's Journey by Max Thackara"
                    loading="lazy"
                >
            </a>

            <a
                href="https://www.amazon.co.uk/First-Cup-Poetry-Collection/dp/B0F92FGWMF"
                class="book"
                target="_blank"
                rel="noopener"
            >
                <img
                    src="images/book2.png"
                    alt="First Cup: Poetry Collection by Max Thackara"
                    loading="lazy"
                >
            </a>

            <a
                href="https://www.amazon.co.uk/Sketches-Early-Womanhood-Max-Thackara/dp/B0FNCQ8SB2"
                class="book"
                target="_blank"
                rel="noopener"
            >
                <img
                    src="images/book4.png"
                    alt="Sketches of Early Womanhood by Max Thackara"
                    loading="lazy"
                >
            </a>

            <a
                href="https://www.amazon.co.uk/Journal-Max-Thackara/dp/B0GD4SKBBG"
                class="book"
                target="_blank"
                rel="noopener"
            >
                <img
                    src="images/book3.png"
                    alt="Journal by Max Thackara"
                    loading="lazy"
                >
            </a>

        </div>

    </section>

</main>

</body>
</html>
