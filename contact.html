<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#FFE5C9">

<title>Contact — Max Thackara</title>

<link
    href="https://fonts.googleapis.com/css2?family=Prata&display=swap"
    rel="stylesheet"
>

<link
    rel="icon"
    type="image/svg+xml"
    href="/images/favicon.svg"
>

<style>

:root {

    --bg: #FFE5C9;

    --text: #44554F;
    --text-soft: rgba(68, 85, 79, 0.78);
    --text-caption: rgba(68, 85, 79, 0.64);

    --line: rgba(68, 85, 79, 0.22);

    --hover: #26302d;
}

* {
    box-sizing: border-box;
}

html {

    margin: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
}

body {

    margin: 0;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Prata', serif;

    color: var(--text);

    display: flex;
    flex-direction: column;

    background: var(--bg);

    overflow-x: hidden;

    position: relative;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* --------------------------------
   PAPER TEXTURE
-------------------------------- */

body::before {

    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.04;

    background-image:
        url("https://www.transparenttextures.com/patterns/paper-fibers.png");
}


/* --------------------------------
   MAIN LAYOUT
-------------------------------- */

main {

    flex: 1;

    width: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding:
        max(56px, env(safe-area-inset-top))
        48px
        max(100px, env(safe-area-inset-bottom));

    position: relative;
    z-index: 2;
}


/* --------------------------------
   HEADER
-------------------------------- */

.header-container {

    text-align: center;

    width: 100%;

    animation: fadeIn 1.1s ease;
}


/* --------------------------------
   TITLE
-------------------------------- */

.title {

    font-size: 2rem;

    letter-spacing: 0.3px;

    margin-bottom: 14px;

    display: inline-block;
    max-width: 100%;
}

.title a {

    text-decoration: none;

    color: inherit;

    display: inline-block;
    max-width: 100%;

    white-space: normal;
    overflow-wrap: break-word;
}


/* --------------------------------
   UNDERLINE
-------------------------------- */

.underline {

    width: 52px;

    height: 1px;

    background-color: var(--line);

    margin:
        0 auto
        34px auto;
}


/* --------------------------------
   NAVIGATION
-------------------------------- */

.page-nav {

    display: flex;
    justify-content: center;

    gap: 30px;

    font-size: 1.08rem;

    margin-bottom: 78px;

    flex-wrap: nowrap;
}

.page-nav a {

    text-decoration: none;

    color: var(--text-soft);

    transition:
        color 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;
}

.page-nav a:hover {

    color: var(--hover);

    transform: translateY(-1px);
}

.page-nav a.italic {
    font-style: italic;
}

.page-nav a.current {
    color: var(--text);
}


/* hidden mobile line break */

.nav-break {
    display: none;
}


/* --------------------------------
   CONTACT PAGE
-------------------------------- */

.contact-page {

    width: 100%;
    max-width: 980px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* --------------------------------
   TOP SECTION
-------------------------------- */

.contact-top {

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    margin-bottom: 55px;
}


/* --------------------------------
   PORTRAIT
-------------------------------- */

.portrait-frame {

    width: 225px;
    height: 240px;

    overflow: hidden;

    border-radius: 12px;

    margin-bottom: 21px;
}

.portrait {

    width: 106%;
    height: 106%;

    object-fit: cover;
    object-position: center center;

    display: block;

    transform: translate(-3%, -3%);
}


/* --------------------------------
   PORTRAIT CAPTION
-------------------------------- */

.portrait-caption {

    margin: 0;

    max-width: 360px;

    text-align: center;

    color: var(--text-caption);

    font-size: 0.76rem;

    line-height: 1.7;
}

.portrait-caption .occasion {

    display: block;

    font-style: italic;
}

.portrait-caption .date {

    display: block;
}


/* --------------------------------
   EMAIL
-------------------------------- */

.contact-email {

    margin:
        40px
        0
        0;
}

.contact-email a {

    font-style: normal;

    font-size: 1.05rem;

    text-decoration: none;

    color: var(--text);

    transition:
        color 0.22s ease,
        opacity 0.22s ease;
}

.contact-email a:hover {

    color: var(--hover);
}


/* --------------------------------
   AFFILIATIONS
-------------------------------- */

.contact-affiliations {

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 28px;

    width: 100%;
    max-width: 420px;
}

.affiliation {

    margin: 0;

    text-align: center;

    line-height: 1.85;

    color: var(--text-soft);

    font-size: 0.95rem;
}

.affiliation em {

    font-style: italic;

    color: var(--text);
}

.affiliation a {

    color: var(--text);

    text-decoration: underline;

    text-underline-offset: 3px;

    transition:
        color 0.22s ease,
        opacity 0.22s ease;
}

.affiliation a:hover {

    color: var(--hover);
}


/* --------------------------------
   ACCESSIBILITY
-------------------------------- */

a:focus-visible {

    outline: 1px solid var(--text);

    outline-offset: 4px;
}


/* --------------------------------
   FADE
-------------------------------- */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* --------------------------------
   TABLET
-------------------------------- */

@media (max-width: 980px) {

    main {

        padding:
            max(48px, env(safe-area-inset-top))
            32px
            max(80px, env(safe-area-inset-bottom));
    }

    .title {
        font-size: 1.8rem;
    }

    .page-nav {

        gap: 22px;

        font-size: 1rem;

        margin-bottom: 68px;
    }
}


/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 750px) {

    main {

        padding-top:
            max(38px, env(safe-area-inset-top));

        padding-bottom:
            max(64px, env(safe-area-inset-bottom));

        padding-left:
            max(20px, env(safe-area-inset-left));

        padding-right:
            max(20px, env(safe-area-inset-right));
    }

    .title {

        font-size: 1.55rem;

        margin-bottom: 12px;
    }

    .underline {

        width: 46px;

        margin-bottom: 30px;
    }

    .page-nav {

        flex-wrap: wrap;

        justify-content: center;

        gap: 14px 22px;

        font-size: 0.98rem;

        margin-bottom: 54px;

        max-width: 340px;

        margin-left: auto;
        margin-right: auto;
    }

    .nav-break {

        display: block;

        flex-basis: 100%;

        height: 0;
    }

    .contact-top {

        margin-bottom: 54px;
    }

    .portrait-frame {

        width: 205px;
        height: 220px;

        margin-bottom: 19px;
    }

    .portrait {

        width: 106%;
        height: 106%;

        transform: translate(-3%, -3%);
    }

    .portrait-caption {

        max-width: 340px;

        font-size: 0.72rem;
    }

    .contact-email {

        margin-top: 44px;
    }

    .contact-affiliations {

        max-width: 340px;
    }

    .affiliation {

        font-size: 0.92rem;
    }
}


/* --------------------------------
   SHORT SCREENS
-------------------------------- */

@media (max-height: 700px) {

    main {

        padding-top:
            max(28px, env(safe-area-inset-top));
    }

    .page-nav {

        margin-bottom: 42px;
    }

    .contact-top {

        margin-bottom: 42px;
    }
}


/* --------------------------------
   DYNAMIC MOBILE VIEWPORT
-------------------------------- */

@supports (height: 100dvh) {

    body {
        min-height: 100dvh;
    }
}

</style>
</head>

<body>

<main>

    <div class="header-container">

        <div class="title">

            <a href="index.html">
                Max Thackara
            </a>

        </div>

        <div class="underline"></div>

        <div class="page-nav">

            <a href="books.html">
                Books
            </a>

            <a href="sessions.html">
                Sessions
            </a>

            <a href="readings.html">
                Readings
            </a>

            <a href="editing.html">
                Editing
            </a>

            <span class="nav-break"></span>

            <a href="workshops.html">
                Workshops
            </a>

            <a
                href="contact.html"
                class="current"
            >
                Contact
            </a>

        </div>

    </div>

    <div class="contact-page">

        <div class="contact-top">

            <div class="portrait-frame">

                <img
                    src="images/portrait.png"
                    alt="Max Thackara at The Parlour Issue One gathering"
                    class="portrait"
                >

            </div>

            <p class="portrait-caption">

                <span class="occasion">
                    At The Parlour, Issue One gathering
                </span>

                <span class="date">
                    23 August 2026
                </span>

            </p>

            <p class="contact-email">

                <a href="mailto:contact@maxthackara.uk">
                    contact@maxthackara.uk
                </a>

            </p>

        </div>

        <div class="contact-affiliations">

            <p class="affiliation">

                Editor,
                <em>The Parlour</em><br>

                <a
                    href="https://theparlour.org.uk"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    theparlour.org.uk
                </a>

            </p>

            <p class="affiliation">

                Founder &amp; Director,
                <em>Walkden House Press</em><br>

                <a
                    href="https://walkdenhousepress.co.uk"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    walkdenhousepress.co.uk
                </a>

            </p>

        </div>

    </div>

</main>

</body>
</html>
