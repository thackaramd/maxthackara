<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#FFE5C9">

<title>Max Thackara</title>

<link
    href="https://fonts.googleapis.com/css2?family=Prata&display=swap"
    rel="stylesheet"
>

<link
    rel="icon"
    type="image/svg+xml"
    href="/images/favicon.svg"
>

<style>

:root {

    --bg: #FFE5C9;

    --text: #44554F;
    --text-soft: rgba(68, 85, 79, 0.78);

    --line: rgba(68, 85, 79, 0.22);

    --hover: #26302d;
}


/* --------------------------------
   PAGE
-------------------------------- */

* {
    box-sizing: border-box;
}

html {

    margin: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
}

body {

    margin: 0;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Prata', serif;

    color: var(--text);

    display: flex;
    flex-direction: column;

    overflow-x: hidden;

    background: var(--bg);

    position: relative;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* --------------------------------
   PAPER TEXTURE
-------------------------------- */

body::before {

    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.04;

    background-image:
        url("https://www.transparenttextures.com/patterns/paper-fibers.png");
}


/* --------------------------------
   MAIN
-------------------------------- */

main {

    flex: 1;

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        max(40px, env(safe-area-inset-top))
        24px
        max(56px, env(safe-area-inset-bottom));

    position: relative;
    z-index: 2;
}


/* --------------------------------
   CONTENT
-------------------------------- */

.container {

    text-align: center;

    width: 100%;
    max-width: 560px;

    transform: translateY(-20px);

    animation: fadeIn 1.1s ease;
}

.title {

    font-size: 2rem;

    letter-spacing: 0.3px;

    margin-bottom: 14px;

    color: var(--text);
}

.practice-label {
    position: relative;
    font-size: 0.625rem;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 auto 49px;
}


/* --------------------------------
   NAVIGATION
-------------------------------- */

.nav {

    display: flex;
    flex-direction: column;

    gap: 22px;
    width: max-content;
    margin-inline: auto;
    text-align: left;
    position: relative;
}

.nav::before {
    content: "";
    position: absolute;
    top: -6px;
    bottom: -6px;
    left: 2.125rem;
    width: 0.5px;
    background: var(--line);
    pointer-events: none;
}

.nav a {

    display: grid;
    grid-template-columns: 1.125rem auto;
    column-gap: 2rem;
    align-items: baseline;

    text-decoration: none;

    color: var(--text-soft);

    font-size: 1.22rem;

    transition:
        color 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;
}

.nav-number {
    font-size: 0.625rem;
    font-variant-numeric: lining-nums tabular-nums;
    letter-spacing: 0.04em;
    opacity: 0.65;
}

.nav a:hover {

    color: var(--hover);

    transform: translateY(-1px);
}

.nav a.italic {
    font-style: italic;
}

a:focus-visible {

    outline: 1px solid var(--text);

    outline-offset: 4px;
}


/* --------------------------------
   ANIMATION
-------------------------------- */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(-12px);
    }

    to {
        opacity: 1;
        transform: translateY(-20px);
    }
}


/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 750px) {

    main {

        padding-top:
            max(40px, env(safe-area-inset-top));

        padding-bottom:
            max(56px, env(safe-area-inset-bottom));

        padding-left:
            max(20px, env(safe-area-inset-left));

        padding-right:
            max(20px, env(safe-area-inset-right));
    }

    .container {
        transform: translateY(-14px);
    }

    .title {
        font-size: 1.75rem;
    }

    .practice-label {
        margin-bottom: 41px;
    }

    .nav {
        gap: 21px;
    }

    .nav a {
        font-size: 1.14rem;
    }

    @keyframes fadeIn {

        from {
            opacity: 0;
            transform: translateY(-6px);
        }

        to {
            opacity: 1;
            transform: translateY(-14px);
        }
    }
}


/* --------------------------------
   DYNAMIC MOBILE VIEWPORT
-------------------------------- */

@supports (height: 100dvh) {

    body {
        min-height: 100dvh;
    }
}

.location {
    position: relative;
    z-index: 2;
    width: calc(100% - max(28px, env(safe-area-inset-left)) - max(28px, env(safe-area-inset-right)));
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 max(22px, env(safe-area-inset-bottom));
    font-size: 0.6875rem;
    line-height: 1.6;
    color: var(--text-soft);
}

.location::before {
    content: "";
    position: absolute;
    top: -16px;
    left: 0;
    width: 100%;
    height: 0.5px;
    background: var(--line);
}

@media (min-width: 751px) {
    .location {
        transform: translateY(-48px);
    }
}

/* The divider sits inside the existing name-to-descriptor gap. */
.practice-label::before {
    content: "";
    position: absolute;
    width: 52px;
    height: 0.5px;
    background: var(--line);
    border-radius: 0;
    top: -12px;
    left: 0;
    right: 0;
    margin-inline: auto;
}
@media (max-width: 750px) {
    .practice-label::before { width: 46px; top: -11px; }
}

</style>
</head>

<body>

<main>

    <div class="container">

        <div class="title">
            Max Thackara
        </div>

        <p class="practice-label">Independent Practice</p>

        <nav class="nav">

            <a href="books.html">
                <span class="nav-number" aria-hidden="true">01</span>
                <span>Books</span>
            </a>

            <a href="sessions.html">
                <span class="nav-number" aria-hidden="true">02</span>
                <span>Sessions</span>
            </a>

            <a href="readings.html">
                <span class="nav-number" aria-hidden="true">03</span>
                <span>Readings</span>
            </a>

            <a href="editing.html">
                <span class="nav-number" aria-hidden="true">04</span>
                <span>Editing</span>
            </a>

            <a href="workshops.html">
                <span class="nav-number" aria-hidden="true">05</span>
                <span>Workshops</span>
            </a>

            <a href="contact.html">
                <span class="nav-number" aria-hidden="true">06</span>
                <span>Contact</span>
            </a>

        </nav>

    </div>

</main>

<footer class="location">Bedford, England</footer>

</body>
</html>
