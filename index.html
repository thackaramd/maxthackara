<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#FFE5C9">

<title>Indepedent Practice</title>

<link
    href="https://fonts.googleapis.com/css2?family=Prata&display=swap"
    rel="stylesheet"
>

<link
    rel="icon"
    type="image/svg+xml"
    href="/images/favicon.svg"
>

<style>

:root {

    --bg: #FFE5C9;

    --text: #44554F;
    --text-soft: rgba(68, 85, 79, 0.78);

    --line: rgba(68, 85, 79, 0.30);
    --directory-rule: var(--line);

    --hover: #26302d;
}


/* --------------------------------
   PAGE
-------------------------------- */

* {
    box-sizing: border-box;
}

html {

    margin: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
}

body {

    margin: 0;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Prata', serif;

    color: var(--text);

    display: flex;
    flex-direction: column;

    overflow-x: hidden;

    background: var(--bg);

    position: relative;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* --------------------------------
   PAPER TEXTURE
-------------------------------- */

body::before {

    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.04;

    background-image:
        url("https://www.transparenttextures.com/patterns/paper-fibers.png");
}


/* --------------------------------
   MAIN
-------------------------------- */

main {

    flex: 1;

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        max(40px, env(safe-area-inset-top))
        24px
        max(56px, env(safe-area-inset-bottom));

    position: relative;
    z-index: 2;
}


/* --------------------------------
   CONTENT
-------------------------------- */

.container {

    display: grid;
    grid-template-columns: 1fr max-content 1fr;

    text-align: center;

    width: max-content;
    max-width: 100%;

    transform: translateY(6px);

    animation: fadeIn 1.1s ease;
}

.title {

    grid-column: 1 / -1;

    font-size: 1.8rem;

    letter-spacing: 0.3px;

    margin-bottom: 14px;

    color: var(--text);
}




/* --------------------------------
   PRACTICE DIVIDER
-------------------------------- */




/* --------------------------------
   NAVIGATION
-------------------------------- */

.nav {

    grid-column: 2;
    justify-self: center;

    display: flex;
    flex-direction: column;

    gap: 19.019px;
    width: max-content;

    margin-inline: 0;

    text-align: left;

    position: relative;
}

.nav::before {

    content: "";

    position: absolute;

    top: -6px;
    bottom: -6px;

    left: 2.4575rem;

    width: 0.5px;

    background: var(--directory-rule);

    pointer-events: none;
}

.nav a {

    display: grid;

    grid-template-columns: 1.125rem max-content;

    column-gap: 3.28rem;

    align-items: baseline;

    /* Extend the hit area while keeping the typeset row rhythm. */
    padding-block: 9px;
    margin-block: -9px;

    white-space: nowrap;

    text-decoration: none;

    color: var(--text-soft);

    font-size: 1.033812rem;

    transition:
        color 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;
}

.nav-number {

    font-size: 0.5633rem;

    text-align: right;

    font-variant-numeric: lining-nums tabular-nums;

    letter-spacing: 0.04em;

    opacity: 0.72;
}

.nav a:hover {

    color: var(--hover);

    transform: translateY(-1px);
}

.nav a.italic {

    font-style: italic;
}

a:focus-visible {

    outline: 1px solid var(--text);

    outline-offset: 4px;
}


/* --------------------------------
   LOCATION
-------------------------------- */

.location {

    grid-column: 1 / -1;

    position: relative;

    margin: clamp(72px, 12svh, 112px) 0 0 -6px;
    width: calc(100% + 36px);
    justify-self: start;
    padding: 16px 0 0;

    text-align: left;

    font-size: 0.6875rem;
    line-height: 1.6;

    color: var(--text-soft);
}

.location::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 60%;
    height: 1px;

    background: var(--line);
}


/* --------------------------------
   ANIMATION
-------------------------------- */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(14px);
    }

    to {
        opacity: 1;
        transform: translateY(6px);
    }
}


/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 750px) {

    main {

        padding-top:
            max(40px, env(safe-area-inset-top));

        padding-bottom:
            max(56px, env(safe-area-inset-bottom));

        padding-left:
            max(20px, env(safe-area-inset-left));

        padding-right:
            max(20px, env(safe-area-inset-right));
    }

    .container {

        transform: translateY(10px);
    }

    .title {

        font-size: 1.55rem;
    }

    

    

    .nav {

        gap: 18.1545px;
    }

    .nav a {

        font-size: 0.97196rem;
    }

    .location::before {

        width: 60%;
    }

    @keyframes fadeIn {

        from {
            opacity: 0;
            transform: translateY(18px);
        }

        to {
            opacity: 1;
            transform: translateY(10px);
        }
    }
}


/* --------------------------------
   DYNAMIC MOBILE VIEWPORT
-------------------------------- */

@supports (height: 100dvh) {

    body {
        min-height: 100dvh;
    }
}

/* Desktop masthead proportions */
@media (min-width: 981px) {
    .title { font-size: 1.7rem; }
    
}

/* Homepage-only plaque width; the shared inscription stays unchanged. */
.container > .masthead.title {
    --masthead-plaque-width: calc(100% + 22.08px);
    /* Scale the complete inscription without moving the directory or footer. */
    transform: scale(0.96);
    transform-origin: center;
}


/* Printed register study: retain the plaque and surrounding composition. */
.nav::before { display:none; }
.nav a { position:relative; font-size:1.075rem; }
.nav a::after { display:none; }
.nav a > span:not(.nav-number) { text-shadow:0 -0.015em 0 rgba(40,52,47,.12), 0 0.035em 0 rgba(255,248,236,.58); }
.nav-number { opacity:.72; }
@media(max-width:750px) { .nav a { font-size:1.01rem; } }


/* A quiet closing rule, matching the register strokes. */
.location::before { width:42%; height:0.5px; background:rgba(68,85,79,.19); }

/* A 3% lettering refinement within the fixed homepage plaque. */
.container > .masthead .masthead-practice { transform:scale(0.9312); }
.container > .masthead .masthead-of,
.container > .masthead .masthead-name { transform:scale(0.97); }
.nav a.contact-link { margin-block-start: -3px; }
.contact-link > span { grid-column: 2; }
</style>
<link rel="stylesheet" href="identity.css?v=20261102-1">
</head>

<body>

<main>

    <div class="container">

        <div class="title masthead">
            <span class="masthead-practice">The Independent Practice</span>
            <em class="masthead-of">of</em>
            <span class="masthead-name">Max Thackara</span>
        </div>

        <nav class="nav">

            <a href="conversations.html">
                <span class="nav-number" aria-hidden="true">01</span>
                <span>Conversations</span>
            </a>

            <a href="readings.html">
                <span class="nav-number" aria-hidden="true">02</span>
                <span>Readings</span>
            </a>

            <a href="editing.html">
                <span class="nav-number" aria-hidden="true">03</span>
                <span>Editing</span>
            </a>

            <a href="workshops.html">
                <span class="nav-number" aria-hidden="true">04</span>
                <span>Workshops</span>
            </a>

            <a class="italic contact-link" href="contact.html">
                <span>Contact</span>
            </a>

        </nav>

        <footer class="location">
            Bedford, England
        </footer>

    </div>

</main>

</body>
</html>
